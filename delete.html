<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/delete.css" />
    <script type="text/javascript" src="/js/api.js"></script>
    <script type="text/javascript" src="/js/general.js"></script>
    <title>Document</title>
  </head>
  <body>
    <p id="allincenter">本当に削除しますか？</p>
    <div id="message-area"></div>
    <button id="delete">はい</button>
    <button id="cancel">いいえ</button>
  </body>
  <script>
    if (!checkLogin()) {
      location.href = "/login.html";
    }

    const messageArea = document.getElementById("message-area");
    const urlParams = new URLSearchParams(window.location.search);
    const BookId = urlParams.get("bookid");

    const DELETE_ARTICLE_URL = `http://localhost:8000/register/${BookId}`;

    const deleteApi = async (url) => {
      const response = await fetch(url, {
        method: "DELETE",
        headers: {
          Authorization: `Bearer ${localStorage.getItem("token")}`,
        },
      });
      if (!response.ok) {
        throw new Error(`HTTPエラー! ステータス: ${response.status}`);
      }
      return response.json();
    };

    const handleDeleteConfirm = async () => {
      if (!BookId) {
        console.error("本のIDが不明なため削除できません。");
        messageArea.innerHTML = `<p style="color:red;">本のIDが不明なため削除できません。</p>`;
        return;
      }

      try {
        await deleteApi(DELETE_ARTICLE_URL);
        console.log(`本 (ID: ${BookId}) の削除成功。`);
        messageArea.innerHTML = `<p style="color:red;">削除しました。</p>`;
        setTimeout(() => {
          window.location.href = "/calendar.html";
        }, 2000);
      } catch (error) {
        console.error(
          `本 (ID: ${BookId}) の削除処理中にエラー:`,
          error.message,
        );
        messageArea.innerHTML = `<p style="color:red;">記事の削除に失敗しました。</p>`;
      }
    };

    document
      .getElementById("delete")
      .addEventListener("click", handleDeleteConfirm);

    document.getElementById("cancel").addEventListener("click", () => {
      window.location.href = `/detail.html?bookid=${BookId}`;
    });
  </script>
</html>
