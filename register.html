<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/register.css" />
    <script type="text/javascript" src="/js/general.js"></script>
    <script type="text/javascript" src="/js/api.js"></script>
    <title>register</title>
    

  </head>
  <body>
    <div id="messageArea"></div>
    <div class="container">
      <h1>著書登録</h1>
      <br />
      <input type="hidden" id="modify-article-id" name="article_id" />
      <form id="register-due-form">
      <div>
        <label for="register-title">タイトル:</label>
        <input type="text" id="register-title" name="title" required />
        <br />
        <div class="alignv">
          <label for="register-auther">著者:</label>

          <input type="text" id="register-auther" name="title" required />
        </div>
        <br />
        <label for="register-publisher">出版社:</label>
        <input id="register-publisher" name="label" required />
        <br />
        <label for="register-day">
        <select id="date-type-select">
        <option value="発売日">発売日</option>
        <option value="購入日">購入日</option>
        </select>:
        </label>
        <input type="date" id="register-day" name="due_date" />
        <br>
        <label for="register-price">価格(円):</label>
<input type="number" id="register-price" name="price" min="0" required />
<br />
        <label for="register-imagepath">画像:</label>
        <input type=file id="register-imagepath" name="imagepath"  />
        <br />
       <label>
  <input type="checkbox" id="use-tagcolor" />
  タグに色をつける
</label>
<!-- <input type="color" id="register-tagcolor" disabled /> -->
        <label for="register-tagcolor">タグの色:</label>
        <input type="color" id="register-tagcolor">
<br />
        <label for="register-memo">メモ:</label>
        <textarea id="register-memo" name="body" rows="4"></textarea>
        
      </div>

      <button type="submit">登録</button>
    </div>
    </form>
  <script>
    if (!checkLogin()) {
  location.href = "/index.html";
}
  const API_BASE_URL = "http://localhost:8000";
  const POST_ARTICLES_ENDPOINT = "/register";
  const POST_URL = `${API_BASE_URL}${POST_ARTICLES_ENDPOINT}`;

  const titleInput = document.getElementById("register-title");
  const form = document.getElementById("register-due-form");
  const auther = document.getElementById("register-auther");
  const publisher = document.getElementById("register-publisher");
  const imagepath = document.getElementById("register-imagepath");
  const memo = document.getElementById("register-memo");
  const publishday = document.getElementById("register-day");
  const tagcolor = document.getElementById("register-tagcolor");
  const dateTypeSelect = document.getElementById("date-type-select");
const useTagcolor = document.getElementById("use-tagcolor");
const tagcolorInput = document.getElementById("register-tagcolor");
const price = document.getElementById("register-price");

useTagcolor.addEventListener("change", () => {
  tagcolorInput.disabled = !useTagcolor.checked;
});
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);

    if (params.has('title')) {
      titleInput.value = params.get('title') || '';
      auther.value = params.get('author') || '';
      publisher.value = params.get('publisher') || '';
      publishday.value = params.get('publishday') || '';
       price.value = params.get('itemPrice') || '';
    }
  });

  const postApi = (url, data) => {
    return fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      Authorization: `Bearer ${localStorage.getItem('token')}`,
      },
      body: JSON.stringify(data),
    })
      .then((response) => {
        if (!response.ok) {
          throw new Error(`HTTPエラー! ステータス: ${response.status}`);
        }
        return response.json();
      })
      .catch((error) => {
        console.error("エラー:", error);
        messageArea.innerHTML = `<p style="color:red;">データ取得に失敗しました。<br>${error.message}</p>`;
        throw error; // 例外を再スローする
      });
  };

  const handleFormSubmit = async (event) => {
    // デフォルトの送信をキャンセル
    event.preventDefault();

    const title = titleInput.value;

   const data = {
  "title": titleInput.value,
  "auther": auther.value,
  "publisher": publisher.value,
   "price": Number(price.value) || 0,
  "imagepath": imagepath.value,
  "memo": memo.value,
  "publishday": publishday.value,
  "datetype": dateTypeSelect.value,
  "tagcolor": useTagcolor.checked ? tagcolorInput.value.slice(1) : "",
};

    try {
      const response = await postApi(POST_URL, data);

      // フォームを隠す
      form.style.display = "none";

      // 成功メッセージを表示
      messageArea.innerHTML = `
      <p style="color: green; font-size: 20px;">登録が完了しました！</p>
      <button id="continueBtn">続けて登録する</button>
      <button id="toCalendarBtn">カレンダー一覧に戻る</button>`;

      // 続けて登録ボタンの動作
      document.getElementById("continueBtn").addEventListener("click", () => {
        form.style.display = "block";
        messageArea.innerHTML = "";
        form.reset();
      });

      // カレンダーに戻るボタンの動作
      document.getElementById("toCalendarBtn").addEventListener("click", () => {
        window.location.href = "calendar.html";
      });

    } catch (error) {
      console.error("エラー:", error);
    }
  };

  // フォームの送信イベントをリスン ⇒
  form.addEventListener("submit", handleFormSubmit);
</script>
  </body>
</html>
