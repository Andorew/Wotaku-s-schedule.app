<input type="text" id="keyword" placeholder="鬼滅の刃、ONE PIECEなど" />
<button id="search-btn">検索する</button>

<div
  id="status"
  style="
    margin: 10px 0;
    padding: 10px;
    background: #eee;
    border-left: 5px solid #bf0000;
  "
>
  ここに通信状態が表示されます。
</div>

<div id="results"></div>

<div id="pagination" style="margin: 20px 0; display: none">
  <button id="prev-btn">← 前へ</button>
  <span id="page-label" style="margin: 0 10px"></span>
  <button id="next-btn">次へ →</button>
</div>

<script>
  let allComics = []; // 全ページ分・並び替え済みのコミック一覧
  let currentPage = 1;
  const pageSize = 30;

  function extractVolume(title) {
    const match = title.match(/(\d+)(?!.*\d)/);
    return match ? parseInt(match[1], 10) : -1;
  }

  async function fetchAllBooks(keyword) {
    const statusDiv = document.getElementById("status");
    const resultsDiv = document.getElementById("results");
    const paginationDiv = document.getElementById("pagination");

    resultsDiv.innerHTML = "";
    paginationDiv.style.display = "none";
    allComics = [];

    const maxPagesToFetch = 10; // ← 300件(30件×10ページ)を上限にする

    let page = 1;
    let totalCount = null;
    let hitsPerPage = 30;

    try {
      while (true) {
        statusDiv.innerText = `取得中... (${page} / 最大${maxPagesToFetch}ページ目)`;

        const url = `https://rakuten-books-api.onrender.com/books/search?q=${encodeURIComponent(keyword)}&page=${page}`;
        const response = await fetch(url);

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(
            `サーバーエラー: ${errData.detail || response.statusText}`,
          );
        }

        const data = await response.json();

        if (totalCount === null) {
          totalCount = data.count;
          hitsPerPage = data.hits;
        }

        if (!data.Items || data.Items.length === 0) break;

        const comics = data.Items.filter((book) => book.size === "コミック");
        allComics.push(...comics);

        const maxPageFromServer = Math.ceil(totalCount / hitsPerPage);

        // サーバー側の最終ページに達したか、上限ページ数に達したら終了
        if (page >= maxPageFromServer || page >= maxPagesToFetch) break;

        page++;
      }

      allComics.sort((a, b) => extractVolume(a.title) - extractVolume(b.title));

      if (allComics.length === 0) {
        statusDiv.innerText =
          "通信成功：コミック区分の本が見つかりませんでした。";
        return;
      }

      currentPage = 1;
      renderPage();
    } catch (error) {
      console.error("エラー詳細:", error);
      statusDiv.innerHTML = `<span style="color:red; font-weight:bold;">❌ エラー: ${error.message}</span>`;
    }
  }

  function renderPage() {
    const statusDiv = document.getElementById("status");
    const resultsDiv = document.getElementById("results");
    const paginationDiv = document.getElementById("pagination");

    resultsDiv.innerHTML = "";

    const totalPageCount = Math.ceil(allComics.length / pageSize);
    const start = (currentPage - 1) * pageSize;
    const pageItems = allComics.slice(start, start + pageSize);

    pageItems.forEach((book) => {
      const title = book.title || "";
      const author = book.author || "不明";
      const publisher = book.publisherName || "不明";
      const salesDate = book.salesDate || "不明";
      const image = book.largeImageUrl || book.mediumImageUrl || "";

      const bookEl = document.createElement("div");
      bookEl.style.margin = "20px 0";
      bookEl.innerHTML = `
                <h3>${title}</h3>
                <p>著者: ${author} / 出版社: ${publisher}</p>
                <p>発売日: ${salesDate}</p>
                ${image ? `<img src="${image}" alt="表紙" style="box-shadow: 2px 2px 5px rgba(0,0,0,0.2); max-width: 130px;">` : ""}
                <hr style="border: 0; border-top: 1px solid #ccc; margin-top: 15px;">
            `;
      resultsDiv.appendChild(bookEl);
    });

    statusDiv.innerText = `全 ${allComics.length} 件のコミックを巻数順に表示しています。`;

    document.getElementById("page-label").innerText =
      `${currentPage} / ${totalPageCount} ページ`;
    document.getElementById("prev-btn").disabled = currentPage <= 1;
    document.getElementById("next-btn").disabled =
      currentPage >= totalPageCount;
    paginationDiv.style.display = "block";
  }

  document.getElementById("search-btn").addEventListener("click", () => {
    const keyword = document.getElementById("keyword").value;
    if (!keyword) return alert("キーワードを入力してください");
    fetchAllBooks(keyword);
  });

  document.getElementById("prev-btn").addEventListener("click", () => {
    if (currentPage > 1) {
      currentPage--;
      renderPage();
    }
  });

  document.getElementById("next-btn").addEventListener("click", () => {
    const totalPageCount = Math.ceil(allComics.length / pageSize);
    if (currentPage < totalPageCount) {
      currentPage++;
      renderPage();
    }
  });
</script>
