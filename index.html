<input type="text" id="keyword" placeholder="鬼滅の刃、ONE PIECEなど" />
<button id="search-btn">検索する</button>

<div
  id="status"
  style="
    margin: 10px 0;
    padding: 10px;
    background: #eee;
    border-left: 5px solid #bf0000;
  "
>
  ここに通信状態が表示されます。
</div>

<div id="results"></div>

<div id="pagination" style="margin: 20px 0; display: none">
  <button id="prev-btn">← 前へ</button>
  <span id="page-label" style="margin: 0 10px"></span>
  <button id="next-btn">次へ →</button>
</div>

<script>
  let currentPage = 1;
  let currentKeyword = "";
  let totalPageCount = 1;

  function fetchBooks(keyword, page) {
    const statusDiv = document.getElementById("status");
    const resultsDiv = document.getElementById("results");
    const paginationDiv = document.getElementById("pagination");

    statusDiv.innerText = "検索中...";
    resultsDiv.innerHTML = "";

    const url = `https://rakuten-books-api.onrender.com/books/search?q=${encodeURIComponent(keyword)}&page=${page}`;

    fetch(url)
      .then((response) => {
        if (!response.ok) {
          return response.json().then((errData) => {
            throw new Error(
              `サーバーエラー: ${errData.detail || response.statusText}`,
            );
          });
        }
        return response.json();
      })
      .then((data) => {
        if (!data.Items || data.Items.length === 0) {
          statusDiv.innerText = "通信成功：本が見つかりませんでした。";
          paginationDiv.style.display = "none";
          return;
        }

        // コミックだけに絞り込む
        const comics = data.Items.filter((book) => book.size === "コミック");

        // タイトルから巻数(数字)を抜き出すヘルパー関数
        function extractVolume(title) {
          const match = title.match(/(\d+)(?!.*\d)/); // タイトル中、最後に出てくる数字を拾う
          return match ? parseInt(match[1], 10) : -1; // 数字がなければ -1(末尾に回す)
        }

        // 巻数の昇順で並び替え(1巻→2巻→3巻…の順)
        comics.sort((a, b) => extractVolume(a.title) - extractVolume(b.title));

        let displayCount = 0;

        comics.forEach((book) => {
          const title = book.title || "";
          const author = book.author || "不明";
          const publisher = book.publisherName || "不明";
          const salesDate = book.salesDate || "不明";
          const image = book.largeImageUrl || book.mediumImageUrl || "";

          displayCount++;

          const bookEl = document.createElement("div");
          bookEl.style.margin = "20px 0";
          bookEl.innerHTML = `
            <h3>${title}</h3>
            <p>著者: ${author} / 出版社: ${publisher}</p>
            <p>発売日: ${salesDate}</p>
            ${image ? `<img src="${image}" alt="表紙" style="box-shadow: 2px 2px 5px rgba(0,0,0,0.2); max-width: 130px;">` : ""}
            <hr style="border: 0; border-top: 1px solid #ccc; margin-top: 15px;">
        `;

          resultsDiv.appendChild(bookEl);
        });

        // (以下、ページ情報の表示処理は変更なし)
        totalPageCount = Math.ceil(data.count / data.hits);
        document.getElementById("page-label").innerText =
          `${page} / ${totalPageCount} ページ`;
        paginationDiv.style.display = "block";

        document.getElementById("prev-btn").disabled = page <= 1;
        document.getElementById("next-btn").disabled = page >= totalPageCount;

        if (displayCount === 0) {
          statusDiv.innerText =
            "このページにはコミック区分の本がありませんでした。";
        } else {
          statusDiv.innerText = `成功！このページで ${displayCount} 件のコミックを表示しました。(全 ${data.count} 件中)`;
        }
      })
      .catch((error) => {
        console.error("エラー詳細:", error);
        statusDiv.innerHTML = `<span style="color:red; font-weight:bold;">❌ エラー: ${error.message}</span>`;
      });
  }

  document.getElementById("search-btn").addEventListener("click", () => {
    const keyword = document.getElementById("keyword").value;
    if (!keyword) return alert("キーワードを入力してください");

    currentKeyword = keyword;
    currentPage = 1;
    fetchBooks(currentKeyword, currentPage);
  });

  document.getElementById("prev-btn").addEventListener("click", () => {
    if (currentPage > 1) {
      currentPage--;
      fetchBooks(currentKeyword, currentPage);
    }
  });

  document.getElementById("next-btn").addEventListener("click", () => {
    if (currentPage < totalPageCount) {
      currentPage++;
      fetchBooks(currentKeyword, currentPage);
    }
  });
</script>
